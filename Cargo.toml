[package]
name = "literally_a_counter"
version = "1.0.0"
edition = "2024"

[dependencies]
# Fenêtres et interface (egui).
# On désactive les features par défaut pour choisir le moteur de rendu :
# - "glow" (OpenGL) plutôt que "wgpu" (DirectX 12 par défaut) : la transparence wgpu
#   est cassée par la capture OBS, et glow est bien plus léger ;
# - "default_fonts" : les polices intégrées d'egui (les polices système viendront à l'étape 8).
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
# Bibliothèque de fenêtres utilisée par eframe (déjà embarquée : même version, aucun poids en plus).
# On s'en sert directement pour une seule chose : couper son abonnement aux mouvements bruts de la
# souris et du clavier (« Raw Input »), inutile ici et coûteux (redessin à chaque mouvement).
winit = { version = "0.30.13", default-features = false }
# Audio. On désactive tout par défaut et on n'active que :
# - "playback" : la lecture sur un périphérique audio (via cpal) ;
# - "hound" : un décodeur WAV léger (les sons Windows sont en WAV).
# - "mp3" : sons importés en MP3 (étape 9c), via le décodeur de symphonia (+0,42 Mo).
#   (OGG écarté : +0,8 Mo de plus pour un format peu courant.)
rodio = { version = "0.23.0", default-features = false, features = ["playback", "hound", "mp3"] }
# Accès à l'identifiant système de la fenêtre (déjà utilisé par eframe : aucun poids en plus).
raw-window-handle = "0.6.2"
# Sauvegarde : `serde` transforme nos structs en données (et inversement), grâce à
# `#[derive(Serialize, Deserialize)]` ; `serde_json` lit et écrit ces données en JSON.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Dossier de configuration standard du système (%APPDATA% sous Windows, ~/.config sous Linux…).
dirs = "7.0.0"
# Traductions (étape 10) : la bibliothèque officielle du format Fluent (Mozilla), et les
# identifiants de langue qu'elle utilise. Mesuré : +0,23 Mo, < 1 µs par texte.
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"

# Dépendances utilisées uniquement quand on compile pour Windows.
[target.'cfg(windows)'.dependencies]
# Accès direct à l'API Windows (crate officielle Microsoft).
# Chaque « feature » active une partie de l'API ; on n'active que ce qui sert.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",                # langue de l'interface de Windows
    "Win32_UI_WindowsAndMessaging",       # hook clavier
    "Win32_UI_Input_KeyboardAndMouse",    # état des touches
    "Win32_UI_Input",                     # souris par Raw Input (boutons, molette)
    "Win32_Graphics_Gdi",                 # fenêtre invisible qui reçoit Raw Input
    "Win32_UI_Controls_Dialogs",          # fenêtre « Ouvrir » (import de sons)
    "Win32_System_LibraryLoader",         # hook clavier
    "Win32_System_Registry",              # liste des polices installées
    "Win32_System_Threading",             # identifiant du thread du hook (pour le réveiller)
    "Win32_Graphics_Dwm",                 # liseré, coins arrondis, ombre (Windows 11)
    "Win32_UI_Shell",                     # sous-classe de fenêtre (ligne du haut)
] }

# Exe final (étape 11b) : mesuré 8,82 Mo → 5,39 Mo, sans écart mesurable de vitesse ni de démarrage.
# Outils utilisés seulement À LA COMPILATION (`build.rs`), rien n'est ajouté à l'exe à part
# l'icône elle-même : `winresource` intègre `assets/icon/icon.ico` dans le fichier .exe
# (icône dans l'explorateur, les raccourcis et le gestionnaire des tâches).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true          # optimise tout le programme d'un coup (« link-time optimization »)
codegen-units = 1   # un seul bloc de compilation : optimisations plus poussées
panic = "abort"     # en cas de plantage, arrêt immédiat de toute l'appli (plutôt qu'un thread
                    # des raccourcis mort en silence) ; la valeur est sauvegardée à chaque changement
opt-level = "s"     # privilégie la taille (mesuré : plus petit que "z" ici)
